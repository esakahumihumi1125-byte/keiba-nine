<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>競馬ナイン｜記事の下書き</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#ebf1fa;background:#081426;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#102543,#071320);min-height:100vh}main{max-width:720px;margin:auto;padding:24px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:900;color:#eac06b;font-size:26px;letter-spacing:2px}.muted,small{color:#afc1d7}small{line-height:1.8}.badge{display:inline-block;font-size:12px;border:1px solid #8b7141;border-radius:24px;padding:6px 10px;color:#eac06b;white-space:nowrap}h1{font-size:28px;line-height:1.5;margin:18px 0 8px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;color:#ead4a6}p{line-height:1.9}.panel{background:#152a46;border:1px solid #314461;border-radius:18px;padding:20px;margin:16px 0}.hero{background:linear-gradient(130deg,#203f64,#152a46)}.eyebrow{color:#eac06b;font-size:12px;letter-spacing:2px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #46617f;border-radius:11px;padding:12px 16px;background:#253e5b;color:#edf4ff;min-height:46px}button.primary{background:#d7aa55;color:#142035;border-color:#d7aa55;font-weight:800;width:100%}button[aria-pressed=true]{background:#eac06b;color:#112136;border-color:#eac06b}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}.filters{display:flex;gap:8px;margin:22px 0 12px}.meta{font-size:13px;color:#b0c3dc;margin:14px 0}.card-title{font-size:22px;font-weight:800;margin:12px 0 4px}.line{height:1px;background:#354b65;margin:20px 0}.note{font-size:13px;border-left:3px solid #d7aa55;padding-left:12px;line-height:1.8;color:#b6c8dd}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#0d1d33;border-top:1px solid #334661}nav button{max-width:330px;width:50%;background:transparent}dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}dl div{background:#0c2038;border-radius:12px;padding:14px}dt{color:#afc1d7;font-size:12px}dd{margin:8px 0 0;font-weight:700}summary{cursor:pointer;padding:12px 0;color:#eac06b}a{color:#eac06b}[hidden]{display:none!important}@media(max-width:370px){.logo{font-size:22px}main{padding-inline:12px}.panel{padding:16px}}

label{display:block;margin:18px 0 7px;font-weight:700}input,textarea,select{width:100%;min-width:0;background:#091a2f;color:#fff;border:1px solid #48607c;border-radius:10px;font:inherit;padding:13px}textarea{min-height:260px;line-height:1.8;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #eac06b;outline-offset:2px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions button{flex:1;min-width:130px}.draft{width:100%;text-align:left;margin:6px 0;overflow-wrap:anywhere}.draft strong,.draft small{display:block}.article-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9}#status{min-height:28px;line-height:1.7;margin:15px 0;color:#eac06b}h1{overflow-wrap:anywhere}.subgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.subgrid>*{min-width:0}.danger{color:#ffc0c0}button:disabled{opacity:.5;cursor:default}
</style></head><body><main><header><div><div class="logo">KEIBA NINE</div><small>競馬ナイン｜記事の編集</small></div><span class="badge">下書き専用</span></header>
<p class="note">この画面で保存した記事は公開されません。下書きは、この端末の同じブラウザー内に保存されます。</p>
<div class="row"><h1>記事をつくる</h1><button id="newDraft" type="button">＋ 新しい記事</button></div>
<div id="status" role="status" aria-live="polite">読み込み中…</div>
<section id="editPanel" class="panel"><form id="editor"><label for="title">記事タイトル（必須）</label><input id="title" maxlength="100" required placeholder="例：コースの特徴を読む" autocomplete="off"><div class="subgrid"><div><label for="date">対象日（任意）</label><input id="date" type="date"></div><div><label for="venue">会場</label><select id="venue"><option>共通</option><option>札幌</option><option>函館</option><option>福島</option><option>新潟</option><option>東京</option><option>中山</option><option>中京</option><option>京都</option><option>阪神</option><option>小倉</option></select></div></div><label for="race">レース名（任意）</label><input id="race" maxlength="60" placeholder="例：京都1R"><label for="summary">一覧に表示する紹介文（任意）</label><textarea id="summary" maxlength="200" style="min-height:90px" placeholder="記事の内容を短く紹介"></textarea><label for="body">本文（必須）</label><textarea id="body" maxlength="20000" required placeholder="ここに記事を書いてください。改行はそのまま表示されます。"></textarea><small>文字として保存します。HTMLを入力しても実行されません。</small><div class="actions"><button class="primary" type="submit">下書きを保存</button><button id="preview" type="button">プレビュー</button></div></form></section>
<section id="previewPanel" hidden tabindex="-1"><button id="back" type="button">← 編集に戻る</button><article class="panel"><span class="badge">未公開・プレビュー</span><h1 id="previewTitle"></h1><p id="previewMeta" class="meta"></p><p id="previewSummary" class="muted article-text"></p><div class="line"></div><div id="previewBody" class="article-text"></div></article></section>
<section class="panel"><div class="row"><h2>保存した下書き</h2><span id="draftCount" class="badge">0件</span></div><p class="muted" id="empty">下書きはまだありません。</p><div id="draftList"></div><div class="actions"><button id="exportDrafts" type="button">バックアップを保存</button><button id="deleteDraft" type="button" class="danger" disabled>選択中の下書きを削除</button></div><p class="note">ブラウザーデータの削除などで下書きが消えることがあります。バックアップはJSONファイルで保存できます。従来の実戦記録・Google同期とは別の保存です。</p></section>
</main><script>
'use strict';
const STORE='keiba_nine_editor_drafts_v1';
function validateDraft(d){if(!d.title.trim())throw Error('記事タイトルを入力してな。');if(!d.body.trim())throw Error('本文を入力してな。');return d;}
function decodeDrafts(raw){if(raw===null)return [];const v=JSON.parse(raw);if(v.schema!==1||!Array.isArray(v.drafts))throw Error('保存データの形式を読み取れません。');const ids=new Set();for(const d of v.drafts){if(!d||['id','title','date','venue','race','summary','body','updated'].some(k=>typeof d[k]!=='string')||ids.has(d.id))throw Error('下書きデータを読み取れません。');ids.add(d.id);}return v.drafts;}
function writeDrafts(storage,next){storage.setItem(STORE,JSON.stringify({schema:1,drafts:next}));return next;}
const el=id=>document.getElementById(id),fields=['title','date','venue','race','summary','body'];let drafts=[],selected=null,dirty=false,storageReady=true;
function status(t){el('status').textContent=t;}
function values(){return Object.fromEntries(fields.map(k=>[k,el(k).value]));}
function render(){el('draftCount').textContent=drafts.length+'件';el('empty').hidden=!!drafts.length;el('draftList').replaceChildren();for(const d of [...drafts].sort((a,b)=>b.updated.localeCompare(a.updated))){const b=document.createElement('button');b.type='button';b.className='draft';b.setAttribute('aria-pressed',String(d.id===selected));const title=document.createElement('strong'),meta=document.createElement('small');title.textContent=d.title;meta.textContent=d.venue+' ／ '+new Date(d.updated).toLocaleString('ja-JP');b.append(title,meta);b.onclick=()=>openDraft(d);el('draftList').append(b);}el('deleteDraft').disabled=!selected||!storageReady;el('exportDrafts').disabled=!drafts.length;}
function edit(){el('editPanel').hidden=false;el('previewPanel').hidden=true;}
function mayLeave(){return !dirty||confirm('未保存の変更があります。変更を破棄して移動しますか？');}
function openDraft(d){if(!mayLeave())return;selected=d.id;fields.forEach(k=>el(k).value=d[k]);dirty=false;edit();render();status('保存済みの下書きを開きました。');el('title').focus();}
try{drafts=decodeDrafts(localStorage.getItem(STORE));status('下書きを入力して「下書きを保存」を押してな。');}catch(e){storageReady=false;status('下書きの読み込みに失敗しました。既存データを保護するため保存・削除を停止しています。');}
render();
el('editor').addEventListener('input',()=>{dirty=true;status('未保存の変更があります。');});
el('editor').onsubmit=e=>{e.preventDefault();if(!storageReady){status('保存できません。ブラウザーの保存設定を確認してな。');return;}try{const d={...validateDraft(values()),id:selected||('draft-'+Date.now()+'-'+Math.random().toString(36).slice(2)),updated:new Date().toISOString()};const next=drafts.filter(x=>x.id!==d.id).concat(d);writeDrafts(localStorage,next);drafts=next;selected=d.id;dirty=false;render();status('下書きを端末に保存しました（'+new Date(d.updated).toLocaleTimeString('ja-JP')+'）。公開はしていません。');}catch(e){status('保存できませんでした。'+e.message+' 入力内容は画面に残っています。');}};
el('preview').onclick=()=>{try{const d=validateDraft(values());el('previewTitle').textContent=d.title;el('previewMeta').textContent=[d.date,d.venue,d.race].filter(Boolean).join(' ／ ');el('previewSummary').textContent=d.summary;el('previewSummary').hidden=!d.summary;el('previewBody').textContent=d.body;el('editPanel').hidden=true;el('previewPanel').hidden=false;el('previewPanel').focus();el('previewPanel').scrollIntoView();status(dirty?'プレビュー中。変更はまだ保存されていません。':'保存済みの内容をプレビューしています。');}catch(e){status(e.message);}};
el('back').onclick=()=>{edit();el('body').focus();};
el('newDraft').onclick=()=>{if(!mayLeave())return;selected=null;el('editor').reset();dirty=false;edit();render();status('新しい下書きを入力できます。');el('title').focus();};
el('deleteDraft').onclick=()=>{if(!selected||!storageReady)return;if(!confirm('選択中の下書きを削除しますか？未保存の変更も破棄されます。'))return;try{const next=drafts.filter(d=>d.id!==selected);writeDrafts(localStorage,next);drafts=next;selected=null;dirty=false;el('editor').reset();edit();render();status('選択した下書きを削除しました。');}catch(e){status('削除できませんでした。下書きはそのまま残しています。');}};
el('exportDrafts').onclick=()=>{const blob=new Blob([JSON.stringify({schema:1,drafts},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='keiba-nine-article-drafts-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status('保存済みの下書きのバックアップを作りました。未保存の変更は含みません。');};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
</script></body></html>
