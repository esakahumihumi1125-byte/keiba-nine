<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09172b"><title>競馬ナイン｜購入前チェック</title><style>*{box-sizing:border-box}body{margin:0;background:#09172b;color:#f4f6fa;font-family:-apple-system,sans-serif;padding:18px;line-height:1.6}main{max-width:600px;margin:auto}h1{color:#eac06b;font-size:24px}section{background:#162d48;border:1px solid #38516e;border-radius:16px;padding:16px;margin:15px 0}label{display:block;margin:12px 0 5px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #59718b;background:#0b1c32;color:white;font-size:18px}button{border:0;background:#eac06b;color:#09172b;padding:14px;border-radius:10px;font-weight:bold;font-size:16px;margin:8px 6px 0 0}button.secondary{background:#324d6c;color:white}.item{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #38516e;padding:10px 0}.danger{color:#ffbdad}.muted{color:#b9c8d9;font-size:13px}strong{font-size:22px}a{color:#eac06b}</style><main><h1>KEIBA NINE｜購入前チェック</h1><p class="muted">券種・馬番・金額を確定前に確認する補助画面。実際の馬券購入・アプリ記録・Google保存は行いません。</p><section><label>レース名</label><input id="race" placeholder="例：東京11R"><label>券種</label><select id="type"><option>ワイド</option><option>複勝</option><option>単勝</option><option>馬連</option><option>馬単</option><option>3連複</option><option>3連単</option></select><label>馬番（例：11-20）</label><input id="horses" inputmode="text" placeholder="11-20"><label>金額（円・100円単位）</label><input id="yen" type="number" min="100" step="100" value="100"><button id="add">買い目を追加</button><button id="clear" class="secondary">全消去</button><p id="error" class="danger" role="alert"></p></section><section><h2>最終確認</h2><div id="items" aria-live="polite">まだ買い目がありません。</div><p>合計 <strong id="total">0円</strong></p><label style="display:flex;gap:10px;align-items:center"><input id="check" type="checkbox" style="width:25px;height:25px">券種・馬番・金額を確認した</label><button id="copy" disabled>確認済み買い目をコピー</button><p class="muted">端末内のこのページだけで処理。リロードすると入力は消えます。馬番は実際の出馬表と照合してください。</p></section><p><a href="./keiba-nine-beta51-feed-record.html">競馬ナイン本体へ戻る</a></p></main><script>const $=id=>document.getElementById(id),bets=[];function render(){const box=$('items');box.replaceChildren();if(!bets.length)box.textContent='まだ買い目がありません。';bets.forEach((b,i)=>{const d=document.createElement('div');d.className='item';const t=document.createElement('span');t.textContent=b.race+'｜'+b.type+' '+b.horses+'｜'+b.yen.toLocaleString()+'円';const x=document.createElement('button');x.className='secondary';x.textContent='削除';x.onclick=()=>{bets.splice(i,1);$('check').checked=false;render()};d.append(t,x);box.append(d)});$('total').textContent=bets.reduce((s,b)=>s+b.yen,0).toLocaleString()+'円';$('copy').disabled=!bets.length||!$('check').checked} $('add').onclick=()=>{const race=$('race').value.trim(),type=$('type').value,horses=$('horses').value.trim().replace(/\s+/g,''),yen=Number($('yen').value);const nums=horses.split('-');const needed=type.includes('3連')?3:['ワイド','馬連','馬単'].includes(type)?2:1;if(!race||nums.length!==needed||nums.some(n=>!/^\d{1,2}$/.test(n)||+n<1||+n>99)||new Set(nums).size!==nums.length||!Number.isSafeInteger(yen)||yen<100||yen%100){$('error').textContent='レース名・馬番の数・重複・100円単位の金額を確認してな。';return}$('error').textContent='';bets.push({race,type,horses,yen});$('check').checked=false;render()};$('clear').onclick=()=>{if(bets.length&&!confirm('すべて消去しますか？'))return;bets.length=0;$('check').checked=false;render()};$('check').onchange=render;$('copy').onclick=()=>{const lines=bets.map(b=>b.race+' '+b.type+' '+b.horses+' '+b.yen+'円');lines.push('合計 '+bets.reduce((s,b)=>s+b.yen,0)+'円');navigator.clipboard.writeText(lines.join('\n')).then(()=>alert('コピーしました')).catch(()=>alert('コピーできませんでした'))};</script></html>
