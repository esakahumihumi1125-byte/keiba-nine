<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09172b"><title>競馬ナイン｜購入前チェック</title><style>*{box-sizing:border-box}body{margin:0;background:#09172b;color:#f4f6fa;font-family:-apple-system,sans-serif;padding:18px;line-height:1.6}main{max-width:600px;margin:auto}h1{color:#eac06b;font-size:24px}section{background:#162d48;border:1px solid #38516e;border-radius:16px;padding:16px;margin:15px 0}label{display:block;margin:12px 0 5px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #59718b;background:#0b1c32;color:white;font-size:18px}button{border:0;background:#eac06b;color:#09172b;padding:14px;border-radius:10px;font-weight:bold;font-size:16px;margin:8px 6px 0 0}button.secondary{background:#324d6c;color:white}.item{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #38516e;padding:10px 0}.danger{color:#ffbdad}.muted{color:#b9c8d9;font-size:13px}strong{font-size:22px}a{color:#eac06b}#items .item{align-items:center;background:#0d223b;border:1px solid #405c79;border-radius:12px;margin:9px 0;padding:12px;flex-wrap:wrap}#items .item span{font-size:18px;font-weight:800;overflow-wrap:anywhere;flex:1;min-width:180px}#items .item button{margin:0;min-height:46px}#total{font-size:34px;color:#f2cc77}#copy,#add{width:100%;min-height:52px}#clear{width:100%;min-height:48px}input[type=checkbox]{accent-color:#eac06b}button:disabled{opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eac06b;outline-offset:2px}.summarybar{position:sticky;bottom:0;background:#162d48;padding:12px;border:1px solid #4c6680;border-radius:12px;z-index:2} @media(max-width:400px){body{padding:12px}section{padding:13px}h1{font-size:21px}}.horsegrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:10px 0}.horsegrid button{padding:0;margin:0;min-height:47px;border-radius:10px;background:#2a4461;color:white;font-size:18px}.horsegrid button[aria-pressed=true]{background:#eac06b;color:#081426;outline:2px solid white}.horsegrid button:disabled{opacity:.35}#racePreview,#horsePreview{font-size:15px;font-weight:700;color:#eac06b} @media(max-width:360px){.horsegrid{gap:4px}}.pickrow{margin:10px 0;padding:10px;background:#0d223b;border-radius:12px}.pickrow h3{margin:0;font-size:15px;color:#f3d17f}.pickrow .horsegrid{margin-bottom:2px}#builderPreview{font-size:17px;font-weight:800;color:#f3d17f;padding:8px}#buildAdd{width:100%;min-height:52px}</style><main><h1>KEIBA NINE｜購入前チェック</h1><p class="muted">券種・馬番・金額を確定前に確認する補助画面。実際の馬券購入・アプリ記録・Google保存は行いません。</p><section><label for="raceDate">開催日</label><input id="raceDate" type="date"><label for="track">競馬場</label><select id="track"><option value="">選択してください</option><option>東京</option><option>京都</option><option>福島</option><option>中山</option><option>阪神</option><option>中京</option><option>新潟</option><option>札幌</option><option>函館</option><option>小倉</option></select><label for="raceNo">レース</label><select id="raceNo"><option value="">選択してください</option><option value="1">1R</option><option value="2">2R</option><option value="3">3R</option><option value="4">4R</option><option value="5">5R</option><option value="6">6R</option><option value="7">7R</option><option value="8">8R</option><option value="9">9R</option><option value="10">10R</option><option value="11">11R</option><option value="12">12R</option></select><input id="race" type="hidden"><p id="racePreview" class="muted">開催日・競馬場・レースを選んでください</p><label for="type">券種</label><select id="type"><option>ワイド</option><option>複勝</option><option>単勝</option><option>馬連</option><option>馬単</option><option>3連複</option><option>3連単</option></select><label for="mode">買い方</label><select id="mode"><option value="single">通常（1点ずつ）</option><option value="formation">フォーメーション</option><option value="axis">1頭軸流し</option><option value="axis2">2頭軸流し</option><option value="multi">1頭軸マルチ</option><option value="box">ボックス</option></select><div id="builder" hidden><p id="builderHelp" class="muted"></p><div id="builderGroups"></div><div id="builderPreview" class="muted" aria-live="polite"></div><button type="button" id="buildAdd">まとめて買い目を追加</button></div><div id="singlePick"><label>馬番（数字をタップ）</label><div id="horseButtons" class="horsegrid"></div><input id="horses" type="hidden"><p id="horsePreview" class="muted">馬番を選択してください（出馬表と照合）</p></div><label for="yen">1点の金額</label><select id="yen"><option value="100">100円</option><option value="200">200円</option><option value="300">300円</option><option value="500">500円</option><option value="1000">1,000円</option></select><button id="add">買い目を追加</button><button id="clear" class="secondary">全消去</button><p id="error" class="danger" role="alert"></p></section><section><h2>最終確認</h2><div id="items" aria-live="polite">まだ買い目がありません。</div><div class="summarybar"><span id="count">0点</span> ｜ 合計 <strong id="total">0円</strong></div><label style="display:flex;gap:10px;align-items:center"><input id="check" type="checkbox" style="width:25px;height:25px">券種・馬番・金額を確認した</label><button id="copy" disabled>確認済み買い目をコピー</button><p class="muted">端末内のこのページだけで処理。リロードすると入力は消えます。馬番は実際の出馬表と照合してください。</p></section><p><a href="./keiba-nine-beta51-feed-record.html">競馬ナイン本体へ戻る</a></p></main><script>const $=id=>document.getElementById(id),bets=[];const selectedHorses=[];const requiredCount=()=> $('type').value.includes('3連')?3:['ワイド','馬連','馬単'].includes($('type').value)?2:1;function updateRace(){const date=$('raceDate').value,track=$('track').value,no=$('raceNo').value;$('race').value=date&&track&&no?date+' '+track+no+'R':'';$('racePreview').textContent=$('race').value||'開催日・競馬場・レースを選んでください'}function updateHorses(){$('horses').value=selectedHorses.join('-');$('horsePreview').textContent=selectedHorses.length?selectedHorses.join(' → ')+'（'+selectedHorses.length+'/'+requiredCount()+'頭）':'馬番を選択してください（出馬表と照合）';[...$('horseButtons').children].forEach(b=>b.setAttribute('aria-pressed',selectedHorses.includes(b.textContent)?'true':'false'))}for(let n=1;n<=18;n++){const b=document.createElement('button');b.type='button';b.textContent=String(n);b.setAttribute('aria-pressed','false');b.onclick=()=>{const i=selectedHorses.indexOf(String(n));if(i>=0)selectedHorses.splice(i,1);else if(selectedHorses.length<requiredCount())selectedHorses.push(String(n));updateHorses()};$('horseButtons').append(b)}$('type').onchange=()=>{selectedHorses.length=0;updateHorses()};['raceDate','track','raceNo'].forEach(id=>$(id).onchange=updateRace);$('raceDate').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());updateRace();updateHorses();function render(){const box=$('items');box.replaceChildren();if(!bets.length)box.textContent='まだ買い目がありません。';bets.forEach((b,i)=>{const d=document.createElement('div');d.className='item';const t=document.createElement('span');t.textContent=b.race+'｜'+b.type+' '+b.horses+'｜'+b.yen.toLocaleString()+'円';const x=document.createElement('button');x.className='secondary';x.textContent='削除';x.onclick=()=>{bets.splice(i,1);$('check').checked=false;render()};d.append(t,x);box.append(d)});$('count').textContent=bets.length+'点';$('total').textContent=bets.reduce((s,b)=>s+b.yen,0).toLocaleString()+'円';$('copy').disabled=!bets.length||!$('check').checked} $('add').onclick=()=>{const race=$('race').value.trim(),type=$('type').value,horses=$('horses').value.trim().replace(/\s+/g,''),yen=Number($('yen').value);const nums=horses.split('-');const needed=type.includes('3連')?3:['ワイド','馬連','馬単'].includes(type)?2:1;if(!race||nums.length!==needed||nums.some(n=>!/^\d{1,2}$/.test(n)||+n<1||+n>99)||new Set(nums).size!==nums.length||!Number.isSafeInteger(yen)||yen<100||yen%100){$('error').textContent='レース名・馬番の数・重複・100円単位の金額を確認してな。';return}$('error').textContent='';const key=type==='ワイド'||type==='馬連'||type==='3連複'?nums.slice().sort((a,b)=>+a-+b).join('-'):horses;if(bets.some(b=>b.race===race&&b.type===type&&(type==='ワイド'||type==='馬連'||type==='3連複'?b.horses.split('-').sort((a,b)=>+a-+b).join('-'):b.horses)===key)){$('error').textContent='同じ買い目が既にあります。金額を確認してな。';return}bets.push({race,type,horses,yen});$('check').checked=false;render()};$('clear').onclick=()=>{if(bets.length&&!confirm('すべて消去しますか？'))return;bets.length=0;$('check').checked=false;render()};$('check').onchange=render;$('copy').onclick=()=>{const lines=bets.map(b=>b.race+' '+b.type+' '+b.horses+' '+b.yen+'円');lines.push('合計 '+bets.reduce((s,b)=>s+b.yen,0)+'円');navigator.clipboard.writeText(lines.join('\n')).then(()=>alert('コピーしました')).catch(()=>alert('コピーできませんでした'))};;(()=>{try{const raw=sessionStorage.getItem('kn_purchase_import_v1');sessionStorage.removeItem('kn_purchase_import_v1');if(!raw)return;const data=JSON.parse(raw);if(!data||Date.now()-data.created>10*60*1000||!Array.isArray(data.entries)||data.entries.length>48)return;const entries=data.entries.filter(x=>Array.isArray(x)&&x.length===3&&new Set(x).size===3&&x.every(n=>/^\d{1,2}$/.test(String(n))));if(!entries.length)return;const race=String(data.race||'表示中のレース').slice(0,80);$('race').value=race;$('racePreview').textContent=race+'（予想から引き継ぎ）';[...new Map(entries.map(x=>[x.join('-'),x])).values()].forEach(x=>bets.push({race,type:'3連単',horses:x.join('-'),yen:100}));$('check').checked=false;render();const note=document.createElement('p');note.className='muted';note.textContent='予想画面から'+entries.length+'点を仮入力しました。購入前にレース名・出走馬・金額を必ず照合してください。';$('items').before(note)}catch(e){}})();
;(()=>{const groups=[[],[],[]];const mode=$('mode'),type=$('type');const isOrder=()=>['馬単','3連単'].includes(type.value);const count=()=>type.value.includes('3連')?3:['ワイド','馬連','馬単'].includes(type.value)?2:1;const normalize=a=>isOrder()?a.join('-'):a.slice().sort((x,y)=>+x-+y).join('-');
function combos(){const m=mode.value,k=count(),g=groups;let result=[];if(m==='formation'){const walk=(a,i)=>{if(i===k){if(new Set(a).size===k)result.push(a);return}for(const n of g[i])walk([...a,n],i+1)};walk([],0)}else if(m==='box'){const walk=(a)=>{if(a.length===k){result.push(a);return}for(const n of g[0])if(!a.includes(n))walk([...a,n])};walk([])}else if(m==='axis2'){if(k===3&&g[0].length===2){for(const partner of g[1]){if(g[0].includes(partner))continue;const a=[...g[0],partner];if(isOrder()){for(const x of a)for(const y of a)for(const z of a)if(new Set([x,y,z]).size===3)result.push([x,y,z])}else result.push(a)}}}else if(m==='multi'){if(k===3&&g[0].length===1){const axis=g[0][0],partners=g[1].filter(n=>n!==axis);for(const x of partners)for(const y of partners){if(x===y)continue;result.push([axis,x,y],[x,axis,y],[x,y,axis])}}}else if(m==='axis'){for(const axis of g[0]){const partners=g[1].filter(n=>n!==axis);const walk=(a)=>{if(a.length===k-1){if(isOrder()){const pos=Number($('axisPosition')?.value||1)-1;const x=a.slice();x.splice(pos,0,axis);result.push(x)}else result.push([axis,...a]);return}for(const n of partners)if(!a.includes(n))walk([...a,n])};walk([])}}return [...new Map(result.map(a=>[normalize(a),normalize(a)])).values()].map(x=>x.split('-'))}
function draw(){const m=mode.value,k=count();$('singlePick').hidden=m!=='single';$('builder').hidden=m==='single';$('add').hidden=m!=='single';if(m==='single')return;groups.forEach(a=>a.splice(0));const wrap=$('builderGroups');wrap.replaceChildren();const labels=m==='formation'?Array.from({length:k},(_,i)=>isOrder()?['1着','2着','3着'][i]:['1頭目','2頭目','3頭目'][i]):['axis','axis2','multi'].includes(m)?[m==='axis2'?'軸馬（2頭）':'軸馬（1頭）','相手馬']:['ボックスの馬'];if(m==='axis'&&isOrder()){const lbl=document.createElement('label');lbl.textContent='軸馬の着順';const sel=document.createElement('select');sel.id='axisPosition';for(let i=1;i<=k;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'着固定';sel.append(o)}lbl.append(sel);wrap.append(lbl)}labels.forEach((label,i)=>{const d=document.createElement('div');d.className='pickrow';const h=document.createElement('h3');h.textContent=label;d.append(h);const grid=document.createElement('div');grid.className='horsegrid';for(let n=1;n<=18;n++){const b=document.createElement('button');b.type='button';b.textContent=n;b.setAttribute('aria-pressed','false');b.onclick=()=>{const v=String(n),idx=groups[i].indexOf(v);if(idx<0)groups[i].push(v);else groups[i].splice(idx,1);b.setAttribute('aria-pressed',idx<0?'true':'false');preview()};grid.append(b)}d.append(grid);wrap.append(d)});$('builderHelp').textContent=m==='formation'?'各列の馬番を選択してください。重複する組み合わせは除外します。':m==='axis2'?'軸馬を2頭、相手馬を選択。3連単は全着順の組み合わせです。':m==='multi'?'軸馬1頭と相手馬を選択。軸馬の着順を入れ替えて作成します。':m==='axis'?'軸馬と相手馬を選択してください。軸馬は1頭を選択してください。':'対象馬を選択してください。全組み合わせを自動作成します。';preview()}
function preview(){const invalid=(['axis','multi'].includes(mode.value)&&groups[0].length!==1)||(mode.value==='axis2'&&groups[0].length!==2)||(['axis2','multi'].includes(mode.value)&&(count()!==3||!['3連単','3連複'].includes(type.value)));const a=invalid?[]:combos();$('builderPreview').textContent=invalid?'軸馬の頭数または券種を確認してください（2頭軸・マルチは3連単／3連複）':a.length+'点 ／ '+(a.length*Number($('yen').value)).toLocaleString('ja-JP')+'円';$('buildAdd').disabled=!a.length||a.length>48||invalid;if(a.length>48)$('builderPreview').textContent+='（48点を超えています。馬を絞ってください）'}
mode.onchange=draw;type.addEventListener('change',draw);$('yen').addEventListener('change',preview);
$('buildAdd').onclick=()=>{const race=$('race').value.trim(),yen=Number($('yen').value),t=type.value,a=combos();if(!race){$('error').textContent='開催日・競馬場・レースを選んでください。';return}if(!a.length||a.length>48||!Number.isSafeInteger(yen)||yen<100||yen%100){$('error').textContent='点数・金額を確認してください。';return}const existing=new Set(bets.filter(b=>b.race===race&&b.type===t).map(b=>isOrder()?b.horses:b.horses.split('-').sort((x,y)=>+x-+y).join('-')));let added=0;for(const nums of a){const key=normalize(nums);if(existing.has(key))continue;existing.add(key);bets.push({race,type:t,horses:nums.join('-'),yen});added++}$('check').checked=false;render();$('error').textContent=added?added+'点を追加しました。購入前に必ず確認してください。':'同じ買い目が登録済みです。';};draw()})();
</script></html>
