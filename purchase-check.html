<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09172b"><title>競馬ナイン｜購入前チェック</title><style>*{box-sizing:border-box}body{margin:0;background:#09172b;color:#f4f6fa;font-family:-apple-system,sans-serif;padding:18px;line-height:1.6}main{max-width:600px;margin:auto}h1{color:#eac06b;font-size:24px}section{background:#162d48;border:1px solid #38516e;border-radius:16px;padding:16px;margin:15px 0}label{display:block;margin:12px 0 5px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #59718b;background:#0b1c32;color:white;font-size:18px}button{border:0;background:#eac06b;color:#09172b;padding:14px;border-radius:10px;font-weight:bold;font-size:16px;margin:8px 6px 0 0}button.secondary{background:#324d6c;color:white}.item{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #38516e;padding:10px 0}.danger{color:#ffbdad}.muted{color:#b9c8d9;font-size:13px}strong{font-size:22px}a{color:#eac06b}#items .item{align-items:center;background:#0d223b;border:1px solid #405c79;border-radius:12px;margin:9px 0;padding:12px;flex-wrap:wrap}#items .item span{font-size:18px;font-weight:800;overflow-wrap:anywhere;flex:1;min-width:180px}#items .item button{margin:0;min-height:46px}#total{font-size:34px;color:#f2cc77}#copy,#add{width:100%;min-height:52px}#clear{width:100%;min-height:48px}input[type=checkbox]{accent-color:#eac06b}button:disabled{opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eac06b;outline-offset:2px}.summarybar{position:sticky;bottom:0;background:#162d48;padding:12px;border:1px solid #4c6680;border-radius:12px;z-index:2} @media(max-width:400px){body{padding:12px}section{padding:13px}h1{font-size:21px}}.horsegrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:10px 0}.horsegrid button{padding:0;margin:0;min-height:47px;border-radius:10px;background:#2a4461;color:white;font-size:18px}.horsegrid button[aria-pressed=true]{background:#eac06b;color:#081426;outline:2px solid white}.horsegrid button:disabled{opacity:.35}#racePreview,#horsePreview{font-size:15px;font-weight:700;color:#eac06b} @media(max-width:360px){.horsegrid{gap:4px}}</style><main><h1>KEIBA NINE｜購入前チェック</h1><p class="muted">券種・馬番・金額を確定前に確認する補助画面。実際の馬券購入・アプリ記録・Google保存は行いません。</p><section><label for="raceDate">開催日</label><input id="raceDate" type="date"><label for="track">競馬場</label><select id="track"><option value="">選択してください</option><option>東京</option><option>京都</option><option>福島</option><option>中山</option><option>阪神</option><option>中京</option><option>新潟</option><option>札幌</option><option>函館</option><option>小倉</option></select><label for="raceNo">レース</label><select id="raceNo"><option value="">選択してください</option><option value="1">1R</option><option value="2">2R</option><option value="3">3R</option><option value="4">4R</option><option value="5">5R</option><option value="6">6R</option><option value="7">7R</option><option value="8">8R</option><option value="9">9R</option><option value="10">10R</option><option value="11">11R</option><option value="12">12R</option></select><input id="race" type="hidden"><p id="racePreview" class="muted">開催日・競馬場・レースを選んでください</p><label for="type">券種</label><select id="type"><option>ワイド</option><option>複勝</option><option>単勝</option><option>馬連</option><option>馬単</option><option>3連複</option><option>3連単</option></select><label>馬番（数字をタップ）</label><div id="horseButtons" class="horsegrid"></div><input id="horses" type="hidden"><p id="horsePreview" class="muted">馬番を選択してください（出馬表と照合）</p><label for="yen">1点の金額</label><select id="yen"><option value="100">100円</option><option value="200">200円</option><option value="300">300円</option><option value="500">500円</option><option value="1000">1,000円</option></select><button id="add">買い目を追加</button><button id="clear" class="secondary">全消去</button><p id="error" class="danger" role="alert"></p></section><section><h2>最終確認</h2><div id="items" aria-live="polite">まだ買い目がありません。</div><div class="summarybar"><span id="count">0点</span> ｜ 合計 <strong id="total">0円</strong></div><label style="display:flex;gap:10px;align-items:center"><input id="check" type="checkbox" style="width:25px;height:25px">券種・馬番・金額を確認した</label><button id="copy" disabled>確認済み買い目をコピー</button><p class="muted">端末内のこのページだけで処理。リロードすると入力は消えます。馬番は実際の出馬表と照合してください。</p></section><p><a href="./keiba-nine-beta51-feed-record.html">競馬ナイン本体へ戻る</a></p></main><script>const $=id=>document.getElementById(id),bets=[];const selectedHorses=[];const requiredCount=()=> $('type').value.includes('3連')?3:['ワイド','馬連','馬単'].includes($('type').value)?2:1;function updateRace(){const date=$('raceDate').value,track=$('track').value,no=$('raceNo').value;$('race').value=date&&track&&no?date+' '+track+no+'R':'';$('racePreview').textContent=$('race').value||'開催日・競馬場・レースを選んでください'}function updateHorses(){$('horses').value=selectedHorses.join('-');$('horsePreview').textContent=selectedHorses.length?selectedHorses.join(' → ')+'（'+selectedHorses.length+'/'+requiredCount()+'頭）':'馬番を選択してください（出馬表と照合）';[...$('horseButtons').children].forEach(b=>b.setAttribute('aria-pressed',selectedHorses.includes(b.textContent)?'true':'false'))}for(let n=1;n<=18;n++){const b=document.createElement('button');b.type='button';b.textContent=String(n);b.setAttribute('aria-pressed','false');b.onclick=()=>{const i=selectedHorses.indexOf(String(n));if(i>=0)selectedHorses.splice(i,1);else if(selectedHorses.length<requiredCount())selectedHorses.push(String(n));updateHorses()};$('horseButtons').append(b)}$('type').onchange=()=>{selectedHorses.length=0;updateHorses()};['raceDate','track','raceNo'].forEach(id=>$(id).onchange=updateRace);$('raceDate').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());updateRace();updateHorses();function render(){const box=$('items');box.replaceChildren();if(!bets.length)box.textContent='まだ買い目がありません。';bets.forEach((b,i)=>{const d=document.createElement('div');d.className='item';const t=document.createElement('span');t.textContent=b.race+'｜'+b.type+' '+b.horses+'｜'+b.yen.toLocaleString()+'円';const x=document.createElement('button');x.className='secondary';x.textContent='削除';x.onclick=()=>{bets.splice(i,1);$('check').checked=false;render()};d.append(t,x);box.append(d)});$('count').textContent=bets.length+'点';$('total').textContent=bets.reduce((s,b)=>s+b.yen,0).toLocaleString()+'円';$('copy').disabled=!bets.length||!$('check').checked} $('add').onclick=()=>{const race=$('race').value.trim(),type=$('type').value,horses=$('horses').value.trim().replace(/\s+/g,''),yen=Number($('yen').value);const nums=horses.split('-');const needed=type.includes('3連')?3:['ワイド','馬連','馬単'].includes(type)?2:1;if(!race||nums.length!==needed||nums.some(n=>!/^\d{1,2}$/.test(n)||+n<1||+n>99)||new Set(nums).size!==nums.length||!Number.isSafeInteger(yen)||yen<100||yen%100){$('error').textContent='レース名・馬番の数・重複・100円単位の金額を確認してな。';return}$('error').textContent='';const key=type==='ワイド'||type==='馬連'||type==='3連複'?nums.slice().sort((a,b)=>+a-+b).join('-'):horses;if(bets.some(b=>b.race===race&&b.type===type&&(type==='ワイド'||type==='馬連'||type==='3連複'?b.horses.split('-').sort((a,b)=>+a-+b).join('-'):b.horses)===key)){$('error').textContent='同じ買い目が既にあります。金額を確認してな。';return}bets.push({race,type,horses,yen});$('check').checked=false;render()};$('clear').onclick=()=>{if(bets.length&&!confirm('すべて消去しますか？'))return;bets.length=0;$('check').checked=false;render()};$('check').onchange=render;$('copy').onclick=()=>{const lines=bets.map(b=>b.race+' '+b.type+' '+b.horses+' '+b.yen+'円');lines.push('合計 '+bets.reduce((s,b)=>s+b.yen,0)+'円');navigator.clipboard.writeText(lines.join('\n')).then(()=>alert('コピーしました')).catch(()=>alert('コピーできませんでした'))};;(()=>{try{const raw=sessionStorage.getItem('kn_purchase_import_v1');sessionStorage.removeItem('kn_purchase_import_v1');if(!raw)return;const data=JSON.parse(raw);if(!data||Date.now()-data.created>10*60*1000||!Array.isArray(data.entries)||data.entries.length>48)return;const entries=data.entries.filter(x=>Array.isArray(x)&&x.length===3&&new Set(x).size===3&&x.every(n=>/^\d{1,2}$/.test(String(n))));if(!entries.length)return;const race=String(data.race||'表示中のレース').slice(0,80);$('race').value=race;$('racePreview').textContent=race+'（予想から引き継ぎ）';[...new Map(entries.map(x=>[x.join('-'),x])).values()].forEach(x=>bets.push({race,type:'3連単',horses:x.join('-'),yen:100}));$('check').checked=false;render();const note=document.createElement('p');note.className='muted';note.textContent='予想画面から'+entries.length+'点を仮入力しました。購入前にレース名・出走馬・金額を必ず照合してください。';$('items').before(note)}catch(e){}})();</script></html>
