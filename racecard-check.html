<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競馬ナイン｜出馬表データ検証</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0c1422;color:#edf3fc;max-width:760px;margin:auto;padding:20px;line-height:1.65}a{color:#8ec5ff}textarea{width:100%;box-sizing:border-box;min-height:240px;background:#142338;color:white;border:1px solid #567;padding:12px;border-radius:10px}button{background:#277ad5;color:white;border:0;border-radius:9px;padding:13px 18px;font-size:16px;margin:10px 8px 10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#142338;padding:15px;border-radius:10px}.muted{color:#b6c4d9}</style><h1>出馬表データ検証</h1><p>実データ連携の準備用。利用許諾を確認したデータだけ入力してください。<strong>この画面は自動取得・予想生成・購入・外部送信を行いません。</strong></p><p><a href="./keiba-nine-beta51-feed-record.html">← 競馬ナインに戻る</a></p><label for="data">出馬表JSON</label><textarea id="data" spellcheck="false" placeholder='{"source":"許諾済みの提供元","licenseConfirmed":true,"date":"2026-11-07","track":"京都","race":1,"horses":[{"number":1,"name":"実際の馬名"}]}'></textarea><div><button id="check">形式を検証</button><button id="clear">入力を消す</button></div><p id="status" role="status">未検証</p><pre id="result">検証結果はここに表示します。</pre><p class="muted">馬名・馬番が正しいか、出走取消や公式発走時刻が正しいかは、この形式チェックだけでは保証できません。JRA公式情報との照合が別途必要です。入力内容は保存しません。</p><script>(()=>{'use strict';const $=id=>document.getElementById(id);const tracks=new Set(['札幌','函館','福島','新潟','東京','中山','中京','京都','阪神','小倉']);$('check').onclick=()=>{try{const raw=$('data').value;if(raw.length>100000)throw Error('100KBを超えています');const x=JSON.parse(raw);if(!x||Array.isArray(x)||typeof x!=='object')throw Error('JSONオブジェクトが必要です');if(typeof x.source!=='string'||!x.source.trim()||x.source.length>120||x.licenseConfirmed!==true)throw Error('提供元と利用許諾の確認が必要です');if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||new Date(x.date+'T00:00:00Z').toISOString().slice(0,10)!==x.date)throw Error('開催日が不正です');if(!tracks.has(x.track)||!Number.isInteger(x.race)||x.race<1||x.race>12)throw Error('競馬場・レース番号が不正です');if(!Array.isArray(x.horses)||x.horses.length<1||x.horses.length>18)throw Error('頭数は1〜18頭です');const nums=new Set();for(const h of x.horses){if(!h||!Number.isInteger(h.number)||h.number<1||h.number>18||nums.has(h.number))throw Error('馬番の重複・不正があります');nums.add(h.number);if(typeof h.name!=='string'||!h.name.trim()||h.name.length>100)throw Error('馬名が不正です');if(h.scratched!=null&&typeof h.scratched!=='boolean')throw Error('取消フラグは真偽値で入力してください')}const ordered=[...x.horses].sort((a,b)=>a.number-b.number);$('status').textContent='形式チェックOK（実在・公式照合は未完了）';$('result').textContent=x.date+' '+x.track+x.race+'R｜'+ordered.length+'頭\n'+ordered.map(h=>h.number+'番 '+h.name+(h.scratched?'［取消・入力値］':'')).join('\n')+'\n\n近走・調教・適性：未検証／予想：未生成';}catch(e){$('status').textContent='検証NG';$('result').textContent=e.message||'形式エラー'}};$('clear').onclick=()=>{$('data').value='';$('status').textContent='未検証';$('result').textContent='検証結果はここに表示します。'};})();</script></html>
