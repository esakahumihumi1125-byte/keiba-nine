<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09172b">
  <meta name="robots" content="noindex">
  <title>競馬ナイン｜アプリを開く</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#09172b;color:#ebf1fa;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif}main{width:100%;max-width:480px;padding:30px 24px;background:#162d48;border:1px solid #39536e;border-radius:24px}h1{margin:0;color:#eac06b;font-size:30px;letter-spacing:2px}p{line-height:1.8;color:#bbcadd}a{display:block;margin-top:24px;padding:18px 14px;border-radius:14px;background:#d9af58;color:#09172b;font-size:19px;font-weight:700;text-align:center;text-decoration:none}a:focus-visible{outline:3px solid white;outline-offset:4px}.small{font-size:13px}
  </style>
</head>
<body>
  <main>
    <h1>KEIBA NINE</h1>
    <p id="status" role="status">競馬ナイン BETA 3.5を開きます。</p>
    <a id="openApp" href="./keiba-nine-beta35-premium.html">競馬ナインを開く</a>
    <p class="small">自動で移動しない場合は、上のボタンを押してください。</p>
    <noscript><p class="small">アプリの操作にはJavaScriptを有効にしてください。</p></noscript>
  </main>
  <script>
    // 次回リリースではリンク先と表示バージョンを更新する。
    // 保存データやGoogle接続設定は読み書きしない。
    if (location.protocol === 'https:' || location.protocol === 'http:') {
      location.replace(document.getElementById('openApp').href);
    } else {
      document.getElementById('status').textContent = 'GitHub Pagesへアップロードして使う、競馬ナインの入口です。';
    }
  </script>
</body>
</html>
