name: Racecard engine checks
on:
  push:
    paths:
      - 'racecard-engine.js'
      - 'racecard-engine-tests.js'
      - 'racecard-check.html'
      - 'racecard-batch.js'
      - 'racecard-batch-tests.js'
      - 'racecard-batch.html'
      - 'racecard-reference.js'
      - 'racecard-reference-tests.js'
      - 'scripts/check-racecard-reference-ui.cjs'
      - 'racecard-preview-bridge.js'
      - 'racecard-preview-bridge-tests.js'
      - 'scripts/check-racecard-main-import.cjs'
      - 'keiba-nine-beta51-feed-record.html'
      - '.github/workflows/racecard-validation.yml'
  pull_request:
    paths:
      - 'racecard-engine.js'
      - 'racecard-engine-tests.js'
      - 'racecard-check.html'
      - 'racecard-batch.js'
      - 'racecard-batch-tests.js'
      - 'racecard-batch.html'
      - 'racecard-reference.js'
      - 'racecard-reference-tests.js'
      - 'scripts/check-racecard-reference-ui.cjs'
      - 'racecard-preview-bridge.js'
      - 'racecard-preview-bridge-tests.js'
      - 'scripts/check-racecard-main-import.cjs'
      - 'keiba-nine-beta51-feed-record.html'
      - '.github/workflows/racecard-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-racecard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check engine JavaScript
        run: node --check racecard-engine.js
      - name: Check test JavaScript
        run: node --check racecard-engine-tests.js
      - name: Check bulk JavaScript
        run: |
          node --check racecard-batch.js
          node --check racecard-batch-tests.js
      - name: Check preview bridge JavaScript
        run: |
          node --check racecard-preview-bridge.js
          node --check racecard-preview-bridge-tests.js
      - name: Check independent reference JavaScript
        run: |
          node --check racecard-reference.js
          node --check racecard-reference-tests.js
      - name: Execute independent racecard comparison tests
        run: |
          node -e "global.window=globalThis; require('./racecard-engine.js'); require('./racecard-batch.js'); require('./racecard-reference.js'); require('./racecard-reference-tests.js'); console.log('Reference tests passed:',global.KeibaNineReferenceTests.passed)"
      - name: Execute offline regression tests
        run: |
          node -e "global.window=globalThis; require('./racecard-engine.js'); require('./racecard-engine-tests.js'); console.log('Racecard tests passed:',global.KeibaNineRacecardTests.passed)"
      - name: Execute batch regression tests
        run: |
          node -e "global.window=globalThis; require('./racecard-engine.js'); require('./racecard-batch.js'); require('./racecard-batch-tests.js'); console.log('Batch tests passed:',global.KeibaNineBatchTests.passed)"
      - name: Execute preview bridge regression tests
        run: |
          node -e "global.window=globalThis; require('./racecard-engine.js'); require('./racecard-batch.js'); require('./racecard-preview-bridge.js'); require('./racecard-preview-bridge-tests.js'); console.log('Preview bridge tests passed:',global.KeibaNinePreviewBridgeTests.passed)"
      - name: Verify main app imports exported preview batches
        run: node scripts/check-racecard-main-import.cjs
      - name: Verify reference mismatch blocks local batch export and handoff
        run: node scripts/check-racecard-reference-ui.cjs
