name: Owner Render deploy after private checks
# Two independent fallback hooks: the public preview can fail without blocking
# the private JRDB service, and vice versa. Both need a separately configured
# GitHub Actions secret; neither can read the other's URL.
on:
  workflow_run:
    workflows: ["Private service checks"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: keiba-nine-owner-render-after-checks
  cancel-in-progress: false
jobs:
  deploy-preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger preview only if this exact main SHA passed
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]]; then
            echo '### Preview: SKIPPED (no private deploy hook)' >> "$GITHUB_STEP_SUMMARY"
            echo 'Preview deploy hook not configured; no deploy requested.'
            exit 0
          fi
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "$LATEST" != "$PASSED_SHA" ]]; then
            echo '### Preview: SKIPPED (superseded commit)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Never print or persist the credential-bearing hook URL.
          curl --fail --silent --show-error --max-time 25 --request POST \
            --output /dev/null "$RENDER_DEPLOY_HOOK_URL"
          echo '### Preview: DEPLOY REQUEST SENT (verify Live SHA separately)' >> "$GITHUB_STEP_SUMMARY"
  deploy-jrdb:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger private JRDB owner service only if this exact main SHA passed
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
          RENDER_JRDB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_JRDB_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_JRDB_DEPLOY_HOOK_URL:-}" ]]; then
            echo '### JRDB owner: SKIPPED (no private deploy hook)' >> "$GITHUB_STEP_SUMMARY"
            echo 'JRDB owner deploy hook not configured; no deploy requested.'
            exit 0
          fi
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "$LATEST" != "$PASSED_SHA" ]]; then
            echo '### JRDB owner: SKIPPED (superseded commit)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Never print the hook, keys, race data, or private account details.
          curl --fail --silent --show-error --max-time 25 --request POST \
            --output /dev/null "$RENDER_JRDB_DEPLOY_HOOK_URL"
          echo '### JRDB owner: DEPLOY REQUEST SENT (verify Live SHA separately)' >> "$GITHUB_STEP_SUMMARY"
