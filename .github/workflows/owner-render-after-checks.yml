name: Owner Render deploy after private checks
# Two independent fallback hooks: the public preview can fail without blocking
# the private JRDB service, and vice versa. Both need a separately configured
# GitHub Actions secret; neither can read the other's URL.
on:
  workflow_run:
    workflows: ["Private service checks"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: keiba-nine-owner-render-after-checks
  cancel-in-progress: false
jobs:
  deploy-preview:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger preview only if this exact main SHA passed
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]]; then
            echo '### Preview: SKIPPED (no private deploy hook)' >> "$GITHUB_STEP_SUMMARY"
            echo 'Preview deploy hook not configured; no deploy requested.'
            exit 0
          fi
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "$LATEST" != "$PASSED_SHA" ]]; then
            echo '### Preview: SKIPPED (superseded commit)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Never print or persist the credential-bearing hook URL.
          curl --fail --silent --show-error --max-time 25 --request POST \
            --output /dev/null "$RENDER_DEPLOY_HOOK_URL"
          echo '### Preview: DEPLOY REQUEST SENT (verify Live SHA separately)' >> "$GITHUB_STEP_SUMMARY"
  deploy-jrdb:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy_sent: ${{ steps.trigger.outputs.deploy_sent }}
    steps:
      - name: Trigger private JRDB owner service only if this exact main SHA passed
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
          RENDER_JRDB_DEPLOY_HOOK_URL: ${{ secrets.RENDER_JRDB_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_JRDB_DEPLOY_HOOK_URL:-}" ]]; then
            echo '### JRDB owner: SKIPPED (no private deploy hook)' >> "$GITHUB_STEP_SUMMARY"
            echo 'JRDB owner deploy hook not configured; no deploy requested.'
            exit 0
          fi
          # Only the known JRDB owner service is allowed. Mistakenly
          # pasting the preview hook must never deploy the wrong app.
          case "$RENDER_JRDB_DEPLOY_HOOK_URL" in
            'https://api.render.com/deploy/srv-dbo1m515efls73cl39s0?key='*) ;;
            *)
              echo '### JRDB owner: BLOCKED (wrong hook destination)' >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "$LATEST" != "$PASSED_SHA" ]]; then
            echo '### JRDB owner: SKIPPED (superseded commit)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Never print the hook, keys, race data, or private account details.
          # A timed-out POST may have reached Render: DO NOT blindly retry.
          # Instead make an independent read-only check of the live build.
          if curl --fail --silent --show-error --max-time 25 --request POST \
              --output /dev/null "$RENDER_JRDB_DEPLOY_HOOK_URL"; then
            echo '### JRDB owner: DEPLOY REQUEST ACCEPTED (verify Live SHA separately)' >> "$GITHUB_STEP_SUMMARY"
            echo 'deploy_sent=true' >> "$GITHUB_OUTPUT"
          else
            echo '### JRDB owner: HOOK RESPONSE UNKNOWN (independent live check follows)' >> "$GITHUB_STEP_SUMMARY"
            echo 'deploy_sent=unconfirmed' >> "$GITHUB_OUTPUT"
          fi

  verify-jrdb-live:
    needs: [deploy-jrdb]
    # Do the safe GET even if the hook timed out or was not configured.
    # This can distinguish auto-deploy from a failed outgoing hook.
    if: >-
      always() &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read only the tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify live owner service is serving this exact code
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')
          if [[ "$LATEST" != "$EXPECTED_SHA" ]]; then
            echo '### JRDB owner live code: SKIPPED (superseded main)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Only a safe anonymous GET on the public code-revision endpoint.
          # No owner authentication, private APIs, paid JRDB reads or secrets.
          if python scripts/owner_live_revision_probe.py; then
            echo '### JRDB owner live code: VERIFIED (matching build SHA)' >> "$GITHUB_STEP_SUMMARY"
            echo 'This does not verify JRDB real-data reads, JRA or predictions.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### JRDB owner live code: NOT VERIFIED (outdated, inaccessible or invalid)' >> "$GITHUB_STEP_SUMMARY"
            echo 'Deployment hook success alone does not prove a running new revision.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
