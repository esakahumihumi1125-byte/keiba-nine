name: Private service checks
# Render's checksPass deploy gate needs a CI result on every main commit.
# Do not add path filters: documentation, HTML, JSON, and render.yaml updates
# must also run the same validation before Render is allowed to deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic tests without credentials
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate source syntax
        run: python -m compileall -q scripts deploy
      - name: Smoke-test guarded Render preview without live credentials
        run: |
          python -m pip install -r deploy/render-requirements.txt
          python scripts/smoke-render-preview.py
      - name: Validate owner-only iPhone console JavaScript syntax
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); from private_service import JS; from pathlib import Path; Path('/tmp/keiba-private-console.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-private-console.js
          node scripts/check-private-research-ui.cjs
          node scripts/check-private-program-picker-ui.cjs
          node scripts/check-private-oneclick-readiness-ui.cjs
          node scripts/check-private-course-ui.cjs
          node scripts/check-private-history-ui.cjs
          node scripts/check-private-raceday-ui.cjs
          node scripts/check-private-manual-ui.cjs
          node scripts/check-private-operator-factor-ui.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from manual_ticket_book import JS; from pathlib import Path; Path('/tmp/keiba-private-manual-tickets.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-private-manual-tickets.js
          node scripts/check-private-manual-tickets-ui.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from jrdb_mail_local_import import JS; from pathlib import Path; Path('/tmp/keiba-jrdb-mail-local.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-jrdb-mail-local.js
          node scripts/check-private-jrdb-mail-local.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from manual_purchase_book import JS; from pathlib import Path; Path('/tmp/keiba-private-purchases.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-private-purchases.js
          node scripts/check-private-real-purchases-ui.cjs
          node --check owner-ticket-transfer.js
          python -c "import sys; sys.path.insert(0, 'scripts'); from owner_ticket_handoff import JS; from pathlib import Path; Path('/tmp/keiba-private-owner-handoff.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-private-owner-handoff.js
          node scripts/check-owner-ticket-handoff.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from jrdb_day_pipeline_ui import JS; from pathlib import Path; Path('/tmp/keiba-jrdb-day-pipeline.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-jrdb-day-pipeline.js
          node scripts/check-private-day-pipeline-ui.cjs
