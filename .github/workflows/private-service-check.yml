name: Private service checks
# Render's checksPass deploy gate needs a CI result on every main commit.
# Do not add path filters: documentation, HTML, JSON, and render.yaml updates
# must also run the same validation before Render is allowed to deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run synthetic tests without credentials
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate source syntax
        run: python -m compileall -q scripts deploy
      - name: Smoke-test guarded Render preview without live credentials
        run: |
          python -m pip install -r deploy/render-requirements.txt
          python scripts/smoke-render-preview.py
      - name: Validate owner-only iPhone console JavaScript syntax
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); from private_service import JS; from pathlib import Path; Path('/tmp/keiba-private-console.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-private-console.js
          python -c "import sys; sys.path.insert(0, 'scripts'); from private_service import OWNER_UPDATE_JS; from pathlib import Path; Path('/tmp/keiba-owner-update.js').write_text(OWNER_UPDATE_JS, encoding='utf-8')"
          node --check /tmp/keiba-owner-update.js
          node scripts/check-owner-update-ui.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from owner_backup import JS; from pathlib import Path; Path('/tmp/keiba-owner-backup.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-owner-backup.js
          node scripts/check-owner-backup-ui.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from owner_factor_scorecard import JS; from pathlib import Path; Path('/tmp/keiba-owner-scorecard.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-owner-scorecard.js
          node scripts/check-owner-factor-scorecard-ui.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from owner_race_workbench import JS; from pathlib import Path; Path('/tmp/keiba-owner-race-workbench.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-owner-race-workbench.js
          node scripts/check-owner-race-workbench-ui.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from owner_preday_forecast_ui import JS; from pathlib import Path; Path('/tmp/keiba-owner-preday-forecast.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-owner-preday-forecast.js
          node scripts/check-owner-preday-forecast-ui.cjs
          node scripts/check-keiba-gas-bridge.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from owner_result_review import JS; from pathlib import Path; Path('/tmp/keiba-owner-result-review.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-owner-result-review.js
          node scripts/check-owner-review-ui.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from owner_one_race_trial_ui import JS; from pathlib import Path; Path('/tmp/keiba-owner-auto-trial.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-owner-auto-trial.js
          node scripts/check-owner-auto-trial-ui.cjs
          node scripts/check-owner-day-trial-ui.cjs
          node scripts/check-private-research-ui.cjs
          node scripts/check-private-program-picker-ui.cjs
          node scripts/check-private-oneclick-readiness-ui.cjs
          node scripts/check-private-course-ui.cjs
          node scripts/check-private-history-ui.cjs
          node scripts/check-private-raceday-ui.cjs
          node scripts/check-private-manual-ui.cjs
          node scripts/check-private-operator-factor-ui.cjs
          python -c "import sys; sys.path.insert(0, 'scripts'); from manual_ticket_book import JS; from pathlib import Path; Path('/tmp/keiba-private-manual-tickets.js').write_text(JS, encoding='utf-8')"
          node --check /tmp/keiba-private-manual-tickets.js
