name: Diagnose Windows Python 3.11 local tests
on:
  push:
    branches:
      - diagnostic/windows-local-unittest-errors
permissions:
  contents: read
jobs:
  reproduce-on-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vscode-windows-timezone-tests
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the actual VS Code helper from the proposed fix branch
        shell: pwsh
        run: py -3.11 scripts/run_local_tests.py

# Re-run Windows test against updated ASCII-only helper.
