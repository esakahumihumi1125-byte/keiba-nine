# Legacy workflow retained for offline tests only.
# The single approved scheduled publisher lives in keiba-nine-public-publish.yml.
name: KEIBA NINE - Approved Feed Regression Tests

on:
  push:
    paths:
      - scripts/publish_approved_feed.py
      - tests/test_approved_feed_publisher.py
      - .github/workflows/keiba-nine-approved-publish.yml
  pull_request:
    paths:
      - scripts/publish_approved_feed.py
      - tests/test_approved_feed_publisher.py
      - .github/workflows/keiba-nine-approved-publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate authorized feed publisher offline
        run: |
          python -m py_compile scripts/publish_approved_feed.py
          python -m unittest discover -s tests -p 'test_approved_feed_publisher.py' -v
