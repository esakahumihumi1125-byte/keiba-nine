<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>競馬ナイン｜自分用実戦記録</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1c2e;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:14px;line-height:1.5}main{max-width:620px;margin:auto}h1{font-size:23px}h2{font-size:18px}section{background:#172d46;border:1px solid #405b78;border-radius:16px;padding:15px;margin:14px 0}label{display:block;margin:10px 0 4px;font-weight:650}input,select{width:100%;min-height:48px;background:#0b1d32;color:white;border:1px solid #66809b;border-radius:10px;padding:10px;font-size:17px}button{border:0;border-radius:11px;min-height:48px;padding:11px 15px;background:#f1cc7b;color:#142238;font-weight:800;font-size:16px}button.secondary{background:#334f6e;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0b2037;padding:12px 7px;border-radius:12px;text-align:center}.stat strong{display:block;font-size:19px;font-variant-numeric:tabular-nums}.muted{font-size:13px;color:#b7c9d9}.item{padding:12px 0;border-bottom:1px solid #42566d}.item strong{display:block;font-size:17px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.actions button{min-height:42px;font-size:13px}a{color:#f1cc7b}#notice{min-height:20px;color:#f1cc7b}@media(max-width:390px){.stats{grid-template-columns:1fr 1fr 1fr}.stat strong{font-size:16px}}</style><main><h1>🏇 競馬ナイン｜自分用実戦記録</h1><p class="muted">購入した馬券だけを記録。テスト予想は含めません。記録はこのブラウザの端末内に保存されます（Google同期なし）。</p><section><h2>実戦収支</h2><div class="stats"><div class="stat">投資<strong id="invest">0円</strong></div><div class="stat">払戻<strong id="return">0円</strong></div><div class="stat">回収率<strong id="rate">—</strong></div></div><p id="profit"></p></section><section><h2>実際に買った馬券を追加</h2><label for="date">日付</label><input id="date" type="date"><div class="grid"><div><label for="track">競馬場</label><select id="track"><option value="">選択</option><option>東京</option><option>京都</option><option>福島</option><option>中山</option><option>阪神</option><option>中京</option><option>新潟</option><option>札幌</option><option>函館</option><option>小倉</option><option>海外</option></select></div><div><label for="race">レース</label><select id="race"><option value="">選択</option></select></div></div><div class="grid"><div><label for="bet">券種</label><select id="bet"><option>3連単</option><option>3連複</option><option>ワイド</option><option>馬連</option><option>馬単</option><option>単勝</option><option>複勝</option><option>WIN5</option></select></div><div><label for="stake">投資額（円）</label><input id="stake" type="number" min="100" step="100" value="100"></div></div><label for="payout">払戻額（円・未確定は0）</label><input id="payout" type="number" min="0" step="1" value="0"><button id="save" style="width:100%;margin-top:16px">実戦記録を保存</button><p id="notice" role="status"></p></section><section><h2>保存した実戦記録</h2><div id="records"></div><div class="actions"><button id="export" class="secondary">CSVでバックアップ</button><button id="clear" class="secondary">全記録を消去</button></div><p class="muted">ブラウザのデータ削除や機種変更で記録が失われる場合があります。CSVを定期的に保存してください。これは既存のGoogleシート連携とは別の補助記録です。</p></section><p><a href="./keiba-nine-beta51-feed-record.html">← 予想画面に戻る</a></p></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),key='kn_personal_real_v1';let data=[];try{const v=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(v))data=v.filter(x=>x&&Number.isFinite(x.stake)&&Number.isFinite(x.payout))}catch(e){}const yen=n=>Number(n).toLocaleString('ja-JP')+'円';for(let n=1;n<=12;n++)$('race').add(new Option(n+'R',String(n)));$('date').value=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());function persist(){try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){$('notice').textContent='端末に保存できません。ストレージ設定を確認してください。';return false}}function render(){const st=data.reduce((s,x)=>s+x.stake,0),pa=data.reduce((s,x)=>s+x.payout,0);$('invest').textContent=yen(st);$('return').textContent=yen(pa);$('rate').textContent=st?(pa/st*100).toFixed(1)+'%':'—';$('profit').textContent='収支：'+(pa-st>=0?'+':'')+yen(pa-st);$('records').replaceChildren();if(!data.length)$('records').textContent='まだ実戦記録はありません。';data.slice().reverse().forEach(x=>{const div=document.createElement('div');div.className='item';const strong=document.createElement('strong');strong.textContent=x.date+' '+x.track+x.race+'R　'+x.bet;const sub=document.createElement('div');sub.textContent='投資 '+yen(x.stake)+' ／ 払戻 '+yen(x.payout);const btn=document.createElement('button');btn.className='secondary';btn.textContent='削除';btn.onclick=()=>{if(!confirm('この記録を削除しますか？'))return;data=data.filter(v=>v.id!==x.id);persist();render()};const edit=document.createElement('button');edit.textContent='払戻を修正';edit.style.marginRight='8px';edit.onclick=()=>{const answer=prompt('払戻金額（円）を入力してください',String(x.payout));if(answer===null)return;const v=Number(answer.trim());if(!/^\d+$/.test(answer.trim())||!Number.isSafeInteger(v)||v<0){$('notice').textContent='払戻額は0円以上の整数で入力してください。';return}const old=x.payout;x.payout=v;if(!persist())x.payout=old;else{$('notice').textContent='払戻額を更新しました。';render()}};div.append(strong,sub,edit,btn);$('records').append(div)})}$('save').onclick=()=>{const date=$('date').value,track=$('track').value,race=$('race').value,stake=Number($('stake').value),payout=Number($('payout').value);if(!date||!track||!race||!Number.isSafeInteger(stake)||stake<100||stake%100||!Number.isSafeInteger(payout)||payout<0){$('notice').textContent='日付・競馬場・レース・金額を確認してください。';return}data.push({id:Date.now()+'-'+Math.random().toString(36).slice(2),date,track,race,bet:$('bet').value,stake,payout});if(persist()){$('notice').textContent='実戦記録を保存しました。';render()}};$('clear').onclick=()=>{if(!data.length)return;if(!confirm('実戦記録をすべて消去しますか？この操作は戻せません。'))return;data=[];persist();render()};$('export').onclick=()=>{const rows=[['日付','競馬場','R','券種','投資額','払戻額'],...data.map(x=>[x.date,x.track,x.race,x.bet,x.stake,x.payout])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='keiba-nine-real-records.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render()})();</script></html>
